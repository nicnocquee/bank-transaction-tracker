name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AUTH_SECRET: ci-auth-secret-not-for-production
  AUTH_URL: http://localhost:3000
  IMAP_SECRET_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  CRON_SECRET: ci-cron-secret-not-for-production
  ALLOW_FIXTURE_SYNC: "0"
  NEXT_PUBLIC_ALLOW_FIXTURE_SYNC: "0"
  DATABASE_URL: postgresql://tracker:tracker@localhost:5432/bank_transaction_tracker?schema=public

jobs:
  quality:
    name: Lint, typecheck, test, audit, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: tracker
          POSTGRES_DB: bank_transaction_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracker -d bank_transaction_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Apply database migrations
        run: npm run db:migrate:deploy

      - name: Unit and functional tests with coverage
        run: npm run test:coverage

      - name: Dependency audit
        run: npm run ci:audit

      - name: Production build
        run: npm run build
