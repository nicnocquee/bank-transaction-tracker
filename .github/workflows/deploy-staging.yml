name: Deploy staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        # Skip DB-backed suites in CI; run those locally / against staging separately.
        run: npx vitest run --exclude 'src/lib/api/functional-api.test.ts' --exclude 'src/lib/api/route-handlers.test.ts'

      - name: Deploy to Netlify (staging)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID_STAGING }}
        run: npx netlify-cli deploy --build --prod --message "staging ${{ github.sha }}"
