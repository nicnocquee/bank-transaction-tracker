name: Cron IMAP sync

on:
  schedule:
    # Every 5 minutes
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Which environment to sync"
        required: true
        default: both
        type: choice
        options:
          - both
          - production
          - staging

jobs:
  sync-production:
    if: github.event_name == 'schedule' || inputs.target == 'both' || inputs.target == 'production'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger production IMAP sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: https://bank-transaction-tracker.netlify.app
        run: |
          # Netlify serverless caps ~26–30s; the API stops early under that budget.
          http_code="$(curl -sS -o /tmp/cron-sync-body.json -w "%{http_code}" \
            --max-time 28 \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            "${APP_URL}/api/cron/sync")"
          echo "HTTP ${http_code}"
          cat /tmp/cron-sync-body.json || true
          echo
          if [ "$http_code" != "200" ]; then
            echo "Cron sync failed with HTTP ${http_code}" >&2
            exit 1
          fi

  sync-staging:
    if: github.event_name == 'schedule' || inputs.target == 'both' || inputs.target == 'staging'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger staging IMAP sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: https://bank-transaction-tracker-staging.netlify.app
        run: |
          http_code="$(curl -sS -o /tmp/cron-sync-body.json -w "%{http_code}" \
            --max-time 28 \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            "${APP_URL}/api/cron/sync")"
          echo "HTTP ${http_code}"
          cat /tmp/cron-sync-body.json || true
          echo
          if [ "$http_code" != "200" ]; then
            echo "Cron sync failed with HTTP ${http_code}" >&2
            exit 1
          fi
